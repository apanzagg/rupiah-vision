<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="/icons/favicon.png" type="image/png" />
    <title>Benchmark - SuaraRupiah</title>
  </head>
  <body>
    <nav class="pagebar" aria-label="Navigasi">
      <a class="back" href="../">
        <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5.4 14 4l-8 8 8 8 1.4-1.4L8.8 12z" /></svg>
        Kembali ke kamera
      </a>
    </nav>
    <main class="page">
      <h1>Benchmark perangkat</h1>
      <p class="lead">Mengukur waktu muat model dan waktu inferensi per frame di perangkat ini, memakai citra contoh (tanpa kamera). Hasil tidak dikirim ke mana pun; salin manual bila diperlukan.</p>
      <section class="section" aria-label="Pengaturan benchmark">
        <div class="field">
          <label for="variant">Varian model</label>
          <select id="variant"></select>
        </div>
        <div class="field">
          <label for="iters">Jumlah iterasi</label>
          <input id="iters" type="number" min="5" max="500" value="50" />
        </div>
        <p>
          <button id="run" class="btn" type="button">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            Mulai benchmark
          </button>
          <button id="copy" class="btn secondary" type="button">Salin hasil</button>
        </p>
        <p id="state" role="status" aria-live="polite">Siap.</p>
      </section>
      <section class="section" aria-labelledby="hasil">
        <h2 id="hasil">Hasil</h2>
        <table id="table" aria-label="Hasil benchmark"><tbody></tbody></table>
      </section>
      <section class="section" aria-labelledby="mentah">
        <h2 id="mentah">Data mentah</h2>
        <pre id="out"></pre>
      </section>
    </main>
    <script type="module" src="/src/benchmark.ts"></script>
  </body>
</html>
