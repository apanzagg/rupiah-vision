# Job training untuk kernel Kaggle "suararupiah-train" (dibaca training/kaggle/train/main.py).
# Setiap percobaan dicatat di docs/EKSPERIMEN.md.
# Ronde 1 (audit): model cepat untuk menemukan label salah per sumber sebelum training final.
version: v1
runs:
  - {name: e0_r320_audit, imgsz: 320, epochs: 30, patience: 10, batch: 64, args: {cache: ram, train-list: images/train}}
parallel: false
max_hours: 4.0
export: false
save_test: false
audit: true
